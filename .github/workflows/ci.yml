# ============================================================
# Lunaris CI 流水线
# 触发：push 到 main / develop，提 PR 到 main，或在 Actions 页手动运行
# 步骤：后端测试 + 迁移验证 → 前端构建 → 语法检查
#
# 注意：pyproject.toml 在仓库根目录，uv 命令一律在根目录执行（不要 cd backend）
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============ 后端测试 + 迁移 ============
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lunaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        # 含 dev 依赖（pytest / pytest-asyncio / aiosqlite）；在仓库根目录执行
        run: uv sync

      - name: Run tests
        env:
          # 测试用例本身使用内存 SQLite（见 backend/tests/conftest.py），
          # DATABASE_URL 仅用于通过 settings 的必填校验
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET: test-jwt-secret
        run: uv run pytest backend/tests/ -v --tb=short

      - name: Verify migrations
        # 迁移需要真实 PostgreSQL + pgvector，使用上方的 service 容器
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/lunaris_test
          JWT_SECRET: test-jwt-secret
        run: uv run alembic -c backend/alembic/alembic.ini upgrade head

  # ============ 前端构建 ============
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check + Build
        run: |
          cd frontend
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          # vite.config.ts 中 outDir 为 ../electron/renderer（桌面端与 Web 共用产物）
          name: frontend-dist
          path: electron/renderer
          retention-days: 7

  # ============ 代码质量检查 ============
  lint:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Syntax check all Python files
        run: uv run python -m compileall -q backend
