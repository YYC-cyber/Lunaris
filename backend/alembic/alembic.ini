# Alembic 迁移配置 —— 模板
# 实际配置由 config/settings.py 的 DATABASE_URL 覆盖
# （env.py 中从 settings 读取，避免密钥写进 ini）
#
# 迁移脚本命名规范请参考 docs/MIGRATION_GUIDELINES.md
# 格式：NNNN_description_of_change.py（例如：0016_add_moments_comments.py）

[alembic]
script_location = %(here)s
# 迁移脚本自动存储于 versions/ 目录
# 当前最新版本：0015_add_p2_features
# 下一个新迁移应使用：0016_xxx

# sqlalchemy.url 留空，由 env.py 动态注入（保护密钥安全）

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
