# ==============================================================
# Lunaris 后端项目配置（uv 管理）
# 部署命令（在仓库根目录执行）：
#   uv sync
#   uv run alembic upgrade head
#   uv run gunicorn -w 4 -k uvicorn.workers.UvicornWorker backend.main:app
# ==============================================================

[project]
name = "lunaris"
version = "1.0.0"
description = "Lunaris - AI 虚拟伴侣桌面应用后端"
requires-python = ">=3.11"
dependencies = [
    # ---- Web 框架 ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart",          # 文件上传 / 表单解析
    # ---- 数据库 ----
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "pgvector",
    "alembic",                   # 数据库迁移
    # ---- 认证与安全 ----
    "pyjwt",
    "bcrypt",
    "passlib",
    "pydantic-settings",
    # ---- LLM / 内容安全 ----
    "httpx",                     # 调用 DeepSeek / Whisper / TTS / 图片 / RSS
    "textfilter>=0.1.0",         # 中文敏感词过滤（原 toolgood-words 无 Python 版，经评审替换）
    # 语义审核：改用 DeepSeek 分类 prompt 实现（原 llm-guard 依赖 torch>=2.4，
    # 无 Intel Mac 安装包，v1.2.1 评审替换，实现见 core/security.py）
    # ---- 定时任务 ----
    "apscheduler>=3.10",
    # ---- 日志 ----
    "loguru",
    "psycopg2-binary>=2.9.12",
    "python-jose>=3.5.0",
    "websockets>=17.0.1",
    "edge-tts>=7.2.8",
    "psutil",
    "cryptography>=43,<45",
    # ---- 知识库（RAG）文档解析 ----
    "pypdf>=4.0,<6",
    "python-docx>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 测试依赖（uv sync 默认安装；生产 `uv sync --no-dev` 可跳过）
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
include = ["backend*"]
